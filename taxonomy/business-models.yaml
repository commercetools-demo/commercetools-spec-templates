# Business models, and — for the ones that are a PAIR of storefronts — their sides.
# See docs/adr/0008-b2b2x-is-a-pair-of-sides.md for the evidence behind this shape.
schema_version: 2

# ---------------------------------------------------------------------------------------------
# SIDES. A side is one of the two storefronts a B2B2X network runs. It is the unit a developer
# applies: one side, one repository, one bundle.
#
# `seller-portal` is declared ONCE and referenced by both B2B2C and B2B2B, and that is the whole
# point. The two reference implementations' seller portals are 52-of-58 byte-identical pages and
# 99-of-103 byte-identical API routes — and they have ALREADY drifted on four shared routes, with
# the marketplace fork carrying fixes the distributor fork lacks. Two definitions here would
# reproduce that drift in the catalog. One cannot.
#
# There is deliberately NO side for the brand / network operator. In both reference
# implementations everything the brand "keeps" — price floor, approved-content rule, territory
# list, claims disclaimer, commission ladder — is a compile-time constant in the SELLER's app
# config: one brand per deployment, with no surface of its own. So `brand-guardrails` below is a
# gap on the seller portal (a seller must be able to READ the rules binding them), but the
# operator's authoring and enforcement of those rules has nowhere to live here.
# Do NOT author operator-facing capabilities into `seller-portal` because it is the only side
# available — that ships back-office content to a seller. It belongs in a different catalog.
sides:
  seller-portal:
    label: The seller portal
    description: >
      Where your sellers sign in: they buy from you here, and they run the store they sell from
      here. A B2B storefront plus the tools to run a store — which products it carries, what it
      charges, what it promotes, who its customers are, and what it is owed.
    inherits: [B2B]
    supported_models: [B2B2C, B2B2B]
    # Needed by every seller portal, whichever network it sits in.
    gap_capabilities:
      - seller-onboarding
      - seller-scoped-assortment
      - seller-tailored-product-content
      - store-scoped-selling-price
      - cost-price-separate-from-resale-price
      - seller-scoped-promotions
      - seller-order-book
      - seller-store-identity
      - assisted-ordering

  consumer-storefront:
    label: The shopper storefront
    description: >
      The shop your sellers' own customers buy from. A B2C storefront where assortment, price,
      content and stock are all resolved from the one seller the shopper is bound to.
    inherits: [B2C]
    supported_models: [B2B2C]
    gap_capabilities:
      - seller-scope-resolution
      - seller-directory
      - seller-scoped-assortment
      - seller-tailored-product-content
      - single-seller-cart
      - seller-attribution-on-order
      - split-fulfillment
      - assisted-ordering

  business-storefront:
    label: The business-buyer storefront
    # `description` is read out to a developer, so it says what they get, not how it was decided.
    # The reasoning for inheriting BOTH roots: a file-by-file diff of the two reference
    # storefronts returns zero changed lines for every shopping and account page, so the B2B-ness
    # is a per-session branch on one storefront, not a second storefront.
    description: >
      The shop your sellers' business customers buy from. The shopper storefront, plus a company
      account area — approvals, roles, company profile, shared lists — that appears once the
      person signing in turns out to be buying on a company's behalf.
    inherits: [B2C, B2B]
    supported_models: [B2B2B]
    gap_capabilities:
      - seller-scope-resolution
      - seller-directory
      - seller-scoped-assortment
      - single-seller-cart
      - buying-capacity-resolution
      - two-owner-cart
      - cross-company-isolation
      - seller-entitlement-for-buyer
      - buyer-seller-assignment
      - seller-attribution-on-order
      - split-fulfillment
      - assisted-ordering

# ---------------------------------------------------------------------------------------------
# MODELS. A model with no `sides:` key resolves exactly as it did before this file gained sides —
# that absence is the compatibility hinge, so do not give B2C or B2B an empty `sides: {}`.
business_models:
  B2C:
    label: B2C
    description: Direct to consumer
    inherits: []

  B2B:
    label: B2B
    description: Business buyers
    inherits: []

  B2B2C:
    label: B2B2C
    description: Selling through an intermediary to consumers
    # `inherits` deliberately absent: a sided model inherits per SIDE, because its two sides have
    # different roots. Left on the model it silently resolved the consumer set for both.
    sides:
      seller-portal:
        # This network pays its sellers a commission on brand-fulfilled sales; it carries no
        # receivables. That is the whole per-model difference on this side.
        gap_capabilities: [commission-and-payout, brand-guardrails, seller-customer-roster]
      consumer-storefront: {}

  B2B2B:
    label: B2B2B
    description: Distributor selling through to business buyers
    sides:
      seller-portal:
        # This network's sellers buy stock on credit and owe a balance, so the money capabilities
        # are receivables, not commission. `commission-and-payout` was declared here before ADR 8
        # and is removed: the distributor reference implementation has no commission code at all.
        gap_capabilities:
          - supplier-account-statement
          - buyer-account-roster
          - buyer-credit-standing
          - buyer-seller-assignment
          - reseller-tiered-pricing
      business-storefront: {}
