# GLOBAL epics — the industry-agnostic groups, in build order. A vertical's own
# `vertical.yaml.epics` are industry deltas and sort AFTER these: build the base storefront,
# then layer the industry on top.
#
# These were "the page groups every storefront has" until ADR 8. `seller-operations` breaks that
# reading on purpose: a seller portal is two products in one deployment — a storefront to buy
# through, and an admin console to run a store with — and roughly two thirds of the console had
# no epic to land in. It is still global (it belongs to no industry); it is simply not a page
# group every storefront has.
schema_version: 1
epics:
  - { slug: journeys,             title: "User journeys",
      description: "The paths a buyer takes across pages. Authored first: a journey is the why, a page is the what." }
  - { slug: core-shopping,        title: "Core shopping pages",
      description: "The transactional backbone: discovery through order confirmation. Heaviest mix of CACHED and MIDDLEWARE." }
  - { slug: account-self-service, title: "Account & self-service pages",
      description: "Buyer control over account, orders and purchasing tools without contacting the seller. Almost entirely session-specific." }
  - { slug: b2b-specific,         title: "B2B-specific pages",
      description: "Financial controls, contractual agreements and operational complexity with no B2C equivalent. Almost entirely MIDDLEWARE." }
  - { slug: seller-operations,    title: "Seller operations",
      description: "Running a store rather than buying through one: which products it carries, what it charges, what it promotes, who its customers are, what it is owed. Only resolves on a seller-portal side. Almost entirely MIDDLEWARE." }
  - { slug: content-support,      title: "Content & support pages",
      description: "CMS-managed informational pages with no commerce API dependency. Almost entirely STATIC." }
  - { slug: utility-system,       title: "Utility & system pages",
      description: "Errors, auth token flows and system state. Lightweight by design." }
