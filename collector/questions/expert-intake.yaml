# commercetools-spec-collector — the questionnaire, as data.
#
# ONE form for every industry. `ctsx collect:render` emits a single Apps Script, and the industry
# is the form's first question rather than the choice of which form to open.
#
# This inverts the earlier per-industry fan-out, and the reason that design existed is worth
# keeping written down: no form platform — Google Forms, GitHub Issue Forms, Slack Workflow
# Builder — can pipe an earlier answer into a later question's label. Fanning out bought
# interpolated labels ("...to make it work for Grocery & q-commerce?") at the price of one form,
# one URL and one response sheet per industry, all to be reconciled every round. One form pays the
# opposite price: later questions must say "the industry you picked" instead of naming it. That is
# a wording cost paid once, against an operational cost paid every round.
schema: commercetools.spec-templates.questionnaire/v1
schema_version: 1
id: expert-intake
version: 2
# Rung 0 of the fallback ladder. Rung 2 (a Bolt app + Block Kit modal) consumes this same file,
# and is the only rung that could name the picked industry in the later labels.
targets: [github-issue-form, google-form, slack-modal]

# What the respondent sees at the top of the form, before the first question.
title: commercetools spec collector — industry intake
description: >-
  Pick your industry, then tell us what a bare storefront is missing for it. Three boxes, about
  three minutes. Your answers become reviewed spec drafts that every build for that industry then
  starts from. Please do not name a customer you are under NDA with — describe the pattern instead.

# Optional "where do I ask a question?" link on the rendered form. Left unset on purpose: this
# repo is public, and the answer for a commercetools colleague is an internal channel that means
# nothing to anyone else. Set it in the private repo that actually receives the answers.
# contact:
#   name: Ask about the collector
#   url: https://example.invalid/channel
#   about: Not sure which industry to pick, or whether your answer is useful? Ask first.

questions:
  # Load-bearing. One sheet now holds every industry's answers, and `ctsx collect:ingest` files
  # each response by THIS answer. Rename or remove it and ingest can no longer tell which industry
  # a feature was described for — which is what lint gate K refuses to let happen quietly.
  - id: industry
    type: dropdown
    required: true
    label: "Which industry are you answering about?"
    hint: "One industry per submission. If two of them are yours, please send the form twice — the answers are filed separately."
    options_from: registry.industries
    # The escape hatch is deliberate. A closed list would force an expert in an industry we have
    # not declared yet to file their answer under the nearest wrong one, and that answer is the
    # most valuable kind we get: it says which vertical to create next. Ingest files these under
    # no industry and flags them for a human rather than guessing.
    options_append:
      - "Something else — I'll name it in the boxes below"

  # B2B2C and B2B2B are each a PAIR of shops (ADR 8), and this question cannot say which one an
  # answer is about. That ambiguity is ACCEPTED rather than fixed with a fourth question: a
  # three-minute form is the reason people answer at all, and a feature described in the free text
  # almost always names its own shop ("commission statements for sellers" is not a shopper
  # feature). Triage assigns the side when the capability is authored — it must not guess here.
  - id: business_models
    type: multi
    required: true
    label: "Which business models have you seen this industry run as?"
    options_from: registry.business_models

  - id: feature
    type: long_text
    # Three numbered boxes instead of one textarea. This turns triage from an NLP problem into a
    # data problem: three pre-atomized candidates per respondent, not one paragraph to split.
    repeat: 3
    repeat_required: 1
    label: "Feature {n}: what would you add to a bare storefront to make it work for the industry you picked?"
    hint: "One capability per box. Name it, then say why that industry specifically needs it."
    placeholder: "e.g. catch-weight pricing with tolerance bands, because fresh lines are picked to an approximate weight"
    max_length: 1500

  - id: capability_areas
    type: multi
    required: false
    label: "Which areas do your features touch?"
    # Pre-buckets the free text, which is most of the clustering work done at collection time.
    options_from: registry.domains

  - id: reference
    type: short_text
    required: false
    label: "A retailer or competitor doing this well (optional)"
    hint: "No customer names under NDA — describe the pattern instead."
