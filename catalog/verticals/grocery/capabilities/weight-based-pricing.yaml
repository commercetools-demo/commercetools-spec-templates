schema_version: 1
id: grocery.weight-based-pricing
version: 1.0.0
title: Prices for goods sold by weight or measure
status: published
visibility: public
industry: [grocery]
business_models: [B2C, B2B, B2B2C]
priority: P1
epic: basket-and-pricing
domains: [catalog, pricing, cart, order-management]
skill: commercetools-commerce-patterns

requirement: >
  The system SHALL present goods sold by weight or measure with a price per unit of measure and an
  explicitly provisional order total, until the picked quantity is confirmed by fulfillment.

rationale: >
  Fresh categories are priced per kilogram but picked to an approximate weight, so the amount a
  shopper is charged cannot be final at checkout. Presenting a per-unit price without saying the
  total is provisional is the most common source of grocery billing disputes.

components:
  - { name: Price per unit of measure on the product tile and PDP, data_source: CACHED,     business_models: [B2C, B2B, B2B2C],
      notes: Derived from the priced increment; display concern, not a price type }
  - { name: Provisional-total notice in cart and checkout,          data_source: STATIC,     business_models: [B2C, B2B, B2B2C],
      notes: Static copy; shown whenever any line is weight-variable }
  - { name: Final picked-weight reconciliation on the order,        data_source: MIDDLEWARE, business_models: [B2C, B2B, B2B2C],
      notes: Inbound from fulfillment; commercetools is not the record of truth }
  - { name: Contract price per unit of measure,                     data_source: MIDDLEWARE, business_models: [B2B],
      notes: Channel-scoped Standalone Price; buyer-specific }

scenarios:
  - id: per-unit-price-shown
    given: a product sold by weight
    when: the shopper views it in a list or on its detail page
    then: the price per unit of measure is shown alongside the price of the sellable increment
  - id: total-marked-provisional
    given: a cart containing at least one weight-variable line
    when: the shopper reaches checkout
    then: the order total is presented as provisional, stating that the final amount depends on the picked weight
  - id: picked-weight-reconciled
    given: a placed order with a weight-variable line
    when: fulfillment reports the actually picked weight
    then: the order records the final quantity and amount, and the difference against the provisional amount is visible to the shopper
  - id: discrete-increments-only
    given: a product sold only in fixed increments such as 500 g or 1 kg
    when: the shopper adds it to the cart
    then: only those increments are selectable and the total is exact, not provisional

success_criteria:
  - { id: transparency, metric: no shopper is charged an amount they were not told could change }
  - { id: reconciliation, metric: every weight-variable line on a placed order carries both the provisional and the final amount }

commercetools:
  entities: [Product, ProductVariant, StandalonePrice, Cart, Order, Type]
  api_surface:
    - kind: constraint
      ref: "commercetools has no native unit-of-measure price type - money is stored as integers, so unit-based pricing is a modeling exercise and primarily a display concern"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/configure-b2b-pricing/modeling-unit-based-pricing
      verified_at: 2026-08-21
    - kind: concept
      ref: "Approach 1, variant-based discrete quantities: model each sellable increment (500 g, 1 kg, 6-pack) as a ProductVariant with its own price. Established among grocery customers, keeps everything inside native price selection"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/configure-b2b-pricing/modeling-unit-based-pricing
      verified_at: 2026-08-21
    - kind: concept
      ref: "Approach 2, smallest-unit modeling: price the smallest indivisible unit (one gram) as a Standalone Price, using HighPrecisionMoney when a single unit costs a fraction of a cent, and convert to the display unit in middleware or a custom field"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/configure-b2b-pricing/high-precision-pricing
      verified_at: 2026-08-21
    - kind: concept
      ref: "HighPrecisionMoney pairs preciseAmount with fractionDigits; preciseAmount is a 64-bit integer, so more decimal places means a smaller maximum whole-currency amount - use the smallest fractionDigits that the pricing needs"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/configure-b2b-pricing/high-precision-pricing
      verified_at: 2026-08-21
    - kind: constraint
      ref: "The Cart's priceRoundingMode governs how a HighPrecisionMoney line price becomes payable; HalfEven minimizes cumulative rounding bias across many lines"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/api/carts-orders-overview
      verified_at: 2026-08-21
    - kind: constraint
      ref: "For weighed or measured goods the commercetools order is commonly a preliminary record - the definitive billed quantity is determined by the fulfillment or weighing system at shipment and flows back as the definitive order or invoice"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/configure-b2b-pricing/modeling-unit-based-pricing
      verified_at: 2026-08-21

  modeling_notes: >
    Choose per category, not per project: discrete increments belong to Approach 1 (variants), truly
    continuous quantities to Approach 2 (smallest unit + high precision + middleware conversion).
    State the hand-off to fulfillment explicitly to stakeholders up front - expecting commercetools
    to be the system of record for the exact weighed total is the mistake this capability exists to
    prevent.

tasks_hint:
  - "Decide per fresh category between variant increments and smallest-unit modeling, and record it"
  - "Model the price-per-unit-of-measure display value and surface it on tile and PDP"
  - "Set the Cart priceRoundingMode explicitly for projects using HighPrecisionMoney"
  - "Implement the provisional-total presentation in cart and checkout"
  - "Implement the inbound picked-weight reconciliation onto the placed order"

open_questions:
  - "Which fresh categories sell in fixed increments and which are genuinely continuous?"
  - "Which system is the record of truth for the final billed weight, and how does it report back?"

provenance:
  # Authored from the commercetools documentation, grounded via the commercetools-knowledge MCP.
  source: authored
  contributors: ["@behnamt"]
  reviewed_by: []
  reviewed_at: 2026-08-21
