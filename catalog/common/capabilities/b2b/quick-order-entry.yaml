schema_version: 1
id: base.quick-order-entry
version: 1.0.0
title: Quick order and bulk upload with per-line results
status: published
visibility: public
kind: page
industry: ["*"]
business_models: [B2B, B2B2B]
priority: P1
epic: b2b-specific
page_group: "3. B2B-Specific Pages"
journeys: [B2B-8]
domains: [cart, catalog, search]
skill: commercetools-storefront
supporting_skills: [commercetools-platform, commercetools-commerce-patterns]

requirement: >
  The system SHALL report, for every line of a submitted quick order or uploaded file, whether that
  line reached the cart and at what price, so a buyer is never left comparing the resulting cart
  against their own input to discover which lines failed.

rationale: >
  Procurement buyers submit hundreds of lines at once from a system of their own, and a cart write
  drops line items it considers invalid without raising an error, so a short cart is the normal
  failure mode rather than an exceptional one. Silently losing three lines of two hundred is
  discovered at goods-in, which is the most expensive place to discover it.

components:
  - name: SKU search field with inline resolution
    data_source: MIDDLEWARE
    notes: Product lookup by SKU / part number
  - name: "Multi-line entry table — product name"
    data_source: MIDDLEWARE
    notes: Resolved from SKU lookup
  - name: "Multi-line entry table — price"
    data_source: MIDDLEWARE
    notes: Contract pricing per resolved product
  - name: CSV upload + column mapping
    data_source: STATIC
    notes: Client-side parsing; validation is MIDDLEWARE
  - name: "Validation feedback (unknown SKUs, OOS)"
    data_source: MIDDLEWARE
    notes: Inventory + catalog check
  - name: Add all to cart CTA
    data_source: MIDDLEWARE
    notes: Bulk cart write
  - name: Save as list option
    data_source: MIDDLEWARE
    notes: Write to account requisition lists

scenarios:
  - id: every-line-resolved-and-priced
    given: an uploaded file of codes the buyer's assortment covers, within available stock
    when: the buyer adds all lines to the cart
    then: each line is reported as added with the resolved product name, quantity and the buyer's negotiated unit price
  - id: unknown-code-reported-not-guessed
    given: a file containing a code that matches no product in the buyer's assortment
    when: validation runs
    then: that line is reported unresolved with the submitted value echoed back, and the remaining lines stay available to add
  - id: line-dropped-by-the-platform
    given: a line whose quantity exceeds available stock or whose price is no longer active
    when: the lines are written to the cart
    then: the returned cart is compared against what was submitted and the missing line is reported with its reason, not omitted in silence
  - id: saved-list-carries-no-prices
    given: the buyer saves the entry as a reusable list instead of adding it to the cart
    when: the list is reopened later
    then: codes and quantities are preserved and prices are stated as resolved on conversion to a cart rather than shown from the list

success_criteria:
  - id: line-accounting
    metric: submitted line count equals reported added lines plus reported failed lines, always
  - id: priced-as-contracted
    metric: every added line carries the price the buyer's negotiated agreement resolves for that quantity

commercetools:
  entities: [Cart, LineItem, ShoppingList, Product, ProductVariant, InventoryEntry, Channel, StandalonePrice]
  api_surface:
    - kind: constraint
      ref: >
        After every cart update the platform removes line items that have become invalid - deleted
        product, variant or price, an inactive StandalonePrice, or a quantity outside the associated
        InventoryEntry limits - so a bulk write can return fewer lines than were submitted with no
        error; diff the returned cart against the input
      grounded_by: docs-search
      doc: https://docs.commercetools.com/api/carts-orders-overview
      verified_at: 2026-08-21
    - kind: constraint
      ref: >
        A single update request accepts at most 500 update actions; batching all of them into one
        request is around 20 times faster in total than splitting them across 50 requests, while the
        cart document is hard-capped at 16 MB with 2 MB recommended and carts above 500 line items
        need monitoring
      grounded_by: docs-search
      doc: https://docs.commercetools.com/api/large-cart-performance-tips
      verified_at: 2026-08-21
    - kind: update-action
      ref: >
        addLineItem takes a sku directly, and an added item matching an existing line on the
        merge-relevant fields increases that line's quantity instead of creating a second line - two
        rows of the same code in one upload therefore collapse into one line
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-implement-carts-and-shopping-lists/implement-carts/update-carts
      verified_at: 2026-08-21
    - kind: constraint
      ref: >
        Product Search documents SKU filtering only as a prefix expression on variants.sku, so a
        partial or mistyped code matches several variants; Product Projection Search offers the exact
        filter variants.sku:{sku}, which is what a code-entry pad needs
      grounded_by: docs-search
      doc: https://docs.commercetools.com/api/projects/product-search
      verified_at: 2026-08-21
    - kind: constraint
      ref: >
        Product Projection Search does not filter, facet or sort on Standalone Prices and can return
        inconsistent results for products in Standalone price mode - resolve identity from search and
        take the price from line item price selection on the cart
      grounded_by: docs-search
      doc: https://docs.commercetools.com/api/projects/product-projection-search
      verified_at: 2026-08-21
    - kind: constraint
      ref: >
        Price selection is not supported in the Shopping List context, so a ShoppingListLineItem has
        no price field - a saved requisition list cannot display negotiated prices until it becomes a
        cart
      grounded_by: docs-search
      doc: https://docs.commercetools.com/api/pricing-and-discounts-overview
      verified_at: 2026-08-21
    - kind: constraint
      ref: >
        A Shopping List holds at most 250 line items and 100 text line items, which caps a saved
        requisition list; B2B lists are created through
        /as-associate/{associateId}/in-business-unit/key={businessUnitKey}/shopping-lists and the
        business unit comes from the path, with any value in the body ignored
      grounded_by: docs-search
      doc: https://docs.commercetools.com/api/projects/shoppingLists
      verified_at: 2026-08-21
    - kind: update-action
      ref: >
        addShoppingList copies every line item of a list onto a cart in one call and takes a
        distributionChannel, which sets that channel on each added line so it resolves the buyer's
        negotiated channel-scoped price
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/discover-and-order-products-in-b2b/shopping-lists-for-b2b-purchasing
      verified_at: 2026-08-21
  modeling_notes: >
    Run the page as three distinct passes and keep them separate in the UI: resolve codes to variants
    by exact SKU, validate quantity against inventory and price availability, then write. Batch the
    writes into requests of up to 500 actions and reconcile the returned cart against the submitted
    lines after every batch, because that reconciliation is the only place a dropped line becomes
    visible. Parse the file client-side but never trust it - the resolution and inventory verdicts are
    server-side. Prices belong to the cart, so the entry table's price column is either a preview
    fetched at the buyer's channel scope or blank until the write returns; do not read it from search.

tasks_hint:
  - "Implement exact-SKU resolution for typed and uploaded codes at the buyer's assortment scope"
  - "Validate quantities against inventory and report unresolved and unavailable lines per row"
  - "Batch the add-to-cart write into requests within the 500-action limit and reconcile the returned cart per batch"
  - "Implement save-as-list against the buyer's business unit, and list-to-cart conversion carrying the pricing channel"

open_questions:
  - "Does the buyer's own part number need to resolve alongside the seller's SKU, and where does that cross-reference live?"
  - "What is the accepted maximum number of lines in one upload given the 500-action and cart-size guidance, and is a partially added cart acceptable or does the whole upload fail closed?"
  - "Which file layouts and column orders must be accepted, and is a header row guaranteed?"
  - "Should a line whose quantity exceeds stock be added at the available quantity, added in full for backorder, or refused?"

