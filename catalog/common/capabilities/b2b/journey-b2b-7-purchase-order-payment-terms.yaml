schema_version: 1
id: base.journey-b2b-7-purchase-order-payment-terms
version: 1.0.0
title: B2B-7 — Purchase order & payment terms
kind: journey
status: published
visibility: public
industry: ["*"]
business_models: [B2B, B2B2B]
priority: P1
epic: journeys
domains: [checkout, order-management, pricing]
journeys: [B2B-7]
skill: commercetools-commerce-patterns
supporting_skills: [commercetools-checkout, commercetools-connect]
requirement: >
  The storefront SHALL let a buyer place an order against their own purchase order reference and
  agreed payment terms, so the order can be reconciled and invoiced without a card being charged at
  checkout.
rationale: >
  Most B2B orders are settled by invoice on account, not by card capture. The buyer's finance team
  reconciles against a purchase order raised in their own procurement system, so an order that cannot
  carry that reference is an order their finance team cannot pay.
scenarios:
  - id: purchase-order-reference-carried
    given: a buyer with a purchase order number from their procurement system
    when: the buyer enters it during checkout
    then: the reference is stored on the order and appears on the resulting invoice
  - id: settled-on-terms-not-by-card
    given: a company with agreed net terms
    when: the order is placed
    then: no card is charged at checkout and the order is recorded as payable on those terms
  - id: net-price-quoted-tax-added
    given: a B2B order in a net-priced project
    when: totals are shown
    then: the net amount is the quoted basis and tax is shown added on top, not baked into the price
  - id: credit-limit-exceeded
    given: a company at its credit limit
    when: an order would exceed it
    then: the buyer is told before submission rather than having the order fail after placement
success_criteria:
  - { id: reconcilable, metric: every order carries the buyer's own procurement reference through to the invoice }
commercetools:
  entities: [Cart, Order, Quote, Payment, TaxRate, TaxCategory, CustomObject, Type]
  api_surface:
    - kind: concept
      ref: "purchaseOrderNumber is a native field on Cart, Quote Request, Staged Quote, Quote and Order; a value set on the Cart is inherited by the Order or Quote Request created from it, so it is set once at the start of the flow"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/implement-b2b-purchase-flows/the-b2b-cart
      verified_at: 2026-08-21
    - kind: constraint
      ref: "Use the native purchaseOrderNumber rather than a Custom Field for the PO. Custom Fields remain correct for B2B context with no native field, such as a cost-center reference on a line item"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/implement-b2b-purchase-flows/the-b2b-cart
      verified_at: 2026-08-21
    - kind: concept
      ref: "Most B2B orders settle by invoice on account against agreed net terms; model the settlement with the Payments resource and treat card authorization at checkout as the exception rather than the default"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/implement-b2b-purchase-flows/the-b2b-cart
      verified_at: 2026-08-21
    - kind: constraint
      ref: "includedInPrice false on the Tax Rate means the price is net and tax is added on top, which is the typical B2B configuration; the cart's taxedPrice then exposes both totalNet and totalGross"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/configure-b2b-pricing/net-and-gross-prices-and-tax
      verified_at: 2026-08-21
    - kind: constraint
      ref: "TaxCalculationMode LineItemLevel versus UnitPriceLevel changes when tax is applied relative to quantity; at B2B volumes the rounding difference accumulates across an invoice, and taxRoundingMode controls each step"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/configure-b2b-pricing/net-and-gross-prices-and-tax
      verified_at: 2026-08-21
    - kind: constraint
      ref: "Complex jurisdictions such as United States sales tax require an external tax provider through External or ExternalAmount tax mode; treating them as configuration inside commercetools is a documented and costly modeling mistake"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/configure-b2b-pricing/net-and-gross-prices-and-tax
      verified_at: 2026-08-21
    - kind: concept
      ref: "For B2B data with no native field, a Custom Field belongs on the resource it describes and a Custom Object suits standalone data referenced from elsewhere — a company's credit limit is the Custom Object case"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/implement-b2b-purchase-flows/the-b2b-cart
      verified_at: 2026-08-21
  modeling_notes: >
    Set purchaseOrderNumber on the cart at the start of the flow and let it propagate; retrofitting it
    onto the order loses the quote path. Credit limits and invoicing live downstream — commercetools
    records the order and the settlement intent, the finance system issues and reconciles the invoice.
    Fix TaxMode, TaxCalculationMode and taxRoundingMode as project decisions before building totals.
tasks_hint:
  - "Set purchaseOrderNumber on the cart, not the order, and verify it propagates to the quote path"
  - "Model invoice-on-terms settlement with Payments; make card capture the exception"
  - "Configure net pricing with includedInPrice false and fix the tax calculation and rounding modes"
  - "Surface a credit-limit breach before submission, from whichever system owns the limit"
open_questions:
  - "Which system owns credit limits and invoice generation, and how does the storefront read them?"
  - "Is a purchase order number mandatory for every order, or per company?"
