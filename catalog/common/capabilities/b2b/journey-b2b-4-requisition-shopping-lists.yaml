schema_version: 1
id: base.journey-b2b-4-requisition-shopping-lists
version: 1.0.0
title: B2B-4 — Requisition & shopping lists
kind: journey
status: published
visibility: public
industry: ["*"]
business_models: [B2B, B2B2B]
sides: [seller-portal, business-storefront]
priority: P1
epic: journeys
domains: [cart, catalog, customers]
journeys: [B2B-4]
skill: commercetools-commerce-patterns
supporting_skills: [commercetools-storefront]
requirement: >
  The storefront SHALL let a buyer keep named product lists for repeat and project purchasing, share
  them within their company, and turn one into a cart in a single step at the company's prices.
rationale: >
  Procurement repeats. Rebuilding the same basket by hand each cycle is the friction B2B buyers most
  want removed, and in a procurement team the person who specifies what to buy is often not the
  person who buys it — so a list that only its creator can use solves half the problem.
scenarios:
  - id: list-reordered-in-one-step
    given: a saved list a buyer reorders on a cadence
    when: the buyer converts it to a cart
    then: every line is added in one operation at the company's negotiated prices
  - id: curator-and-buyer-are-different-people
    given: a list created by a procurement lead
    when: a division buyer opens it
    then: the buyer can order from it without being able to edit it
  - id: own-lists-still-visible
    given: a buyer who can see colleagues' lists
    when: the buyer opens their own lists
    then: their own lists are visible too, not hidden by the permission that granted access to others'
  - id: product-no-longer-available
    given: a saved list containing a product that has since been withdrawn
    when: the list is converted to a cart
    then: the unavailable lines are reported rather than silently dropped
success_criteria:
  - { id: one-step-reorder, metric: a standing basket can be reordered without re-adding items individually }
commercetools:
  entities: [ShoppingList, ShoppingListLineItem, Cart, BusinessUnit, Associate, AssociateRole, Channel, Store]
  api_surface:
    - kind: rest
      ref: "B2B shopping lists are created through POST /{projectKey}/as-associate/{associateId}/in-business-unit/key={buKey}/shopping-lists"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/discover-and-order-products-in-b2b/shopping-lists-for-b2b-purchasing
      verified_at: 2026-08-21
    - kind: constraint
      ref: "The Business Unit is taken from the URL path; any businessUnit field in the request body is ignored, so the list always belongs to the Business Unit that was addressed"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/discover-and-order-products-in-b2b/shopping-lists-for-b2b-purchasing
      verified_at: 2026-08-21
    - kind: update-action
      ref: "Cart addShoppingList copies every line item from a list onto the cart in one call; pass distributionChannel on the action so each added line resolves the buyer's negotiated Channel-scoped price rather than an unscoped one"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/discover-and-order-products-in-b2b/shopping-lists-for-b2b-purchasing
      verified_at: 2026-08-21
    - kind: constraint
      ref: "Shopping list access uses paired My/Others permissions and Others does not imply My; the endpoint also requires the manage_shopping_lists scope, and a missing permission returns 403 Forbidden"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/discover-and-order-products-in-b2b/shopping-lists-for-b2b-purchasing
      verified_at: 2026-08-21
    - kind: constraint
      ref: "A Shopping List holds at most 250 line items and 100 text line items, which bounds how large a requisition template can be"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/api/projects/shoppingLists
      verified_at: 2026-08-21
  modeling_notes: >
    Decide who curates and who orders, then assign the My and Others halves of each permission
    accordingly — that decision, not the API, is what makes shared lists work. Forgetting
    distributionChannel on addShoppingList is the quiet failure here: the reorder succeeds and lands
    at the wrong price. A list converted to a cart is also the entry point to the quote flow.
tasks_hint:
  - "Create and read lists through the as-associate / in-business-unit path"
  - "Convert a list to a cart with addShoppingList, always passing the buyer's distributionChannel"
  - "Design roles with both halves of each shopping-list My/Others permission pair"
  - "Report lines that cannot be added rather than dropping them"
open_questions:
  - "Which roles curate lists and which only order from them?"
  - "Do lists need to be scoped to a Store as well as a Business Unit?"
provenance:
