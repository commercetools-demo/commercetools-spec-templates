schema_version: 1
id: base.journey-b2b-3-contract-account-pricing
version: 1.0.0
title: B2B-3 — Viewing contract & account pricing
kind: journey
status: published
visibility: public
industry: ["*"]
business_models: [B2B, B2B2B]
priority: P1
epic: journeys
domains: [pricing, catalog]
journeys: [B2B-3]
skill: commercetools-commerce-patterns
supporting_skills: [commercetools-storefront]
requirement: >
  The storefront SHALL show a buyer the price their company has actually negotiated, on every surface
  where a price appears, rather than a list price the buyer will not be charged.
rationale: >
  In B2B the list price is rarely the price. If negotiated pricing appears only on the product detail
  page, every listing, search result and saved list shows a number the buyer will not pay, which
  destroys trust in the catalog and makes basket totals unpredictable.
scenarios:
  - id: negotiated-price-everywhere
    given: a buyer whose company has negotiated rates
    when: the buyer sees a price on any surface
    then: it is the company's negotiated price, not the unscoped list price
  - id: volume-tier-applied
    given: a product with tiered pricing for the buyer's company
    when: the buyer reaches a tier quantity
    then: the tiered price is applied and the tier that produced it is visible
  - id: no-negotiated-price-exists
    given: a product with no price scoped to the buyer's company
    when: the buyer views it
    then: the fallback that applied is the one price selection resolves, and the buyer is not shown two conflicting prices
  - id: contract-expired
    given: a pricing contract past its validity period
    when: the buyer views a covered product
    then: the expired rate is no longer applied and the buyer can see that the contract has lapsed
success_criteria:
  - { id: one-price, metric: a product never shows a different price on a listing than in the cart for the same buyer }
commercetools:
  entities: [StandalonePrice, Price, Channel, CustomerGroup, Store, Product, Quote]
  api_surface:
    - kind: constraint
      ref: "Price selection resolves in a fixed precedence: currency, then validity dates, then customer group, then distribution channel, then country. Customer group takes precedence over channel, which takes precedence over country"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-price-and-discount-your-products/price-calculation/price-selection
      verified_at: 2026-08-21
    - kind: concept
      ref: "Company-specific rates are usually modelled as Channel-scoped Standalone Prices, with the buyer's distribution Channel carried on the cart's line items so each item resolves the negotiated rate"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/configure-b2b-pricing/company-specific-pricing
      verified_at: 2026-08-21
    - kind: constraint
      ref: "If valid Price tiers exist for the price matching the selection logic, the tiered price is used instead of the base price — tiers are part of selection, not a discount applied afterwards"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-price-and-discount-your-products/price-calculation/price-selection
      verified_at: 2026-08-21
    - kind: constraint
      ref: "Price selection can resolve to no price found, which is how a product becomes unsellable for a given scope rather than merely unpriced"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/api/pricing-and-discounts-overview
      verified_at: 2026-08-21
    - kind: constraint
      ref: "Only Standalone Prices are available in the Modular ProductCatalogModel; Embedded Prices are Classic-only and cap at 100 prices per variant"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/api/pricing-and-discounts-overview
      verified_at: 2026-08-21
  modeling_notes: >
    Keep price concerns and discount concerns separate: a negotiated rate belongs in price selection
    (Channel-scoped Standalone Price), a temporary promotion belongs in discounts. Mixing them makes
    contract renewals a discount-cleanup exercise. Because the catalog is cacheable and the price is
    not, plan the listing surfaces as cached catalog plus a per-buyer price overlay.
tasks_hint:
  - "Model negotiated rates as Channel-scoped Standalone Prices per company"
  - "Carry the buyer's distribution Channel on every price-bearing call and cart line"
  - "Overlay per-buyer prices onto cached listing and search results"
  - "Surface which tier or contract produced the displayed price"
open_questions:
  - "Is the contract record of truth commercetools, an ERP, or a CPQ system?"
  - "Does the business need contract expiry alerts in the storefront, or only in the back office?"
