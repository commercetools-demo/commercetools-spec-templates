schema_version: 1
id: base.invoice-and-billing-history
version: 1.0.0
title: Invoice history and outstanding balance on account
status: published
visibility: public
kind: page
industry: ["*"]
business_models: [B2B, B2B2B]
sides: [seller-portal, business-storefront]
priority: P1
epic: b2b-specific
page_group: "3. B2B-Specific Pages"
journeys: [B2B-7, B2B-9]
domains: [order-management, checkout]
skill: commercetools-connect
supporting_skills: [commercetools-storefront, commercetools-checkout]

requirement: >
  The system SHALL present every invoice raised against the buyer's account with its due date,
  outstanding amount and settlement status as held by the finance system of record, so the balance
  shown to the buyer reconciles with the seller's ledger.

rationale: >
  Net-terms buyers pay against invoices, not orders, and the platform has no invoice resource: the
  finance system issues the invoice and reconciles the payment. An order-derived balance therefore
  omits credit notes, partial payments and consolidated billing, and a buyer who pays from that
  figure underpays or overpays. The page's whole value is that its numbers are the seller's numbers.

components:
  - name: Invoice list
    data_source: MIDDLEWARE
    notes: Finance / ERP integration
  - name: Outstanding balance summary
    data_source: MIDDLEWARE
    notes: Finance / ERP integration
  - name: "Invoice detail — line items, due date, status"
    data_source: MIDDLEWARE
    notes: Invoice document
  - name: Download invoice PDF
    data_source: MIDDLEWARE
    notes: Document service
  - name: Pay now CTA
    data_source: MIDDLEWARE
    notes: Payment gateway integration

scenarios:
  - id: balance-matches-ledger
    given: an account with several open invoices and one credit note
    when: the buyer opens the billing history
    then: the outstanding balance equals the finance system's figure for that account, and each invoice shows the order and purchase order number it bills
  - id: overdue-invoice-distinguished
    given: an invoice whose due date has passed and is unpaid
    when: the list is rendered
    then: that invoice is marked overdue with the number of days, distinctly from invoices that are merely unpaid and still within terms
  - id: pay-now-settles-on-confirmation
    given: an open invoice with a pay-now action available
    when: the buyer completes payment at the gateway
    then: the invoice moves to paid only once the finance system confirms settlement, and until then it is shown as payment in progress
  - id: finance-system-unreachable
    given: the finance system cannot be reached
    when: the buyer opens the page
    then: the last known balance is shown with the time it was read, the failure is stated, and the pay-now action is unavailable rather than posted blind

success_criteria:
  - id: ledger-agreement
    metric: the outstanding balance shown never differs from the finance system's balance for that account
  - id: no-blind-payment
    metric: no payment is accepted against an invoice whose current status could not be read

commercetools:
  entities: [Order, Payment, Transaction, BusinessUnit, Customer, TaxRate, Type]
  api_surface:
    - kind: constraint
      ref: >
        commercetools has no invoice resource. Most B2B orders settle by invoice on account against
        agreed net terms, with a downstream financial system issuing the invoice and reconciling
        payment; model the settlement with the Payments resource and treat card capture at checkout
        as the B2B exception
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/implement-b2b-purchase-flows/the-b2b-cart
      verified_at: 2026-08-21
    - kind: concept
      ref: >
        Order paymentState is an enum of exactly BalanceDue, Failed, Pending, CreditOwed and Paid,
        set with the changePaymentState update action - a per-order flag, not an aging balance, so it
        cannot carry due dates or partial settlement
      grounded_by: docs-search
      doc: https://docs.commercetools.com/api/projects/orders
      verified_at: 2026-08-21
    - kind: concept
      ref: >
        purchaseOrderNumber is a native field on Cart, Quote Request, Staged Quote, Quote and Order
        and is inherited from the cart onto what is created from it, which makes it the join key
        between an invoice and the order it bills; use it rather than a Custom Field
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/implement-b2b-purchase-flows/the-b2b-cart
      verified_at: 2026-08-21
    - kind: concept
      ref: >
        A Payment holds the PSP reference, the payment method and the connected transactions, and an
        Order or Cart references payments through PaymentInfo; a pay-now flow records a transaction
        in Pending and moves it to Success or Failure on the PSP's webhook or return
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-implement-checkout/custom-checkout/payment
      verified_at: 2026-08-21
    - kind: constraint
      ref: >
        B2B is billed net: with TaxRate includedInPrice false the quoted figure is the net basis and
        tax is added on top, and the taxedPrice exposes totalNet and totalGross - the payable total on
        an invoice is the gross one
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/configure-b2b-pricing/net-and-gross-prices-and-tax
      verified_at: 2026-08-21
  modeling_notes: >
    The finance system is the system of record for the invoice, its due date and the balance; the
    storefront is a read surface over it plus a payment initiation path. Keep the order's
    paymentState as a mirror of that state for order-level display, never as its source, and update it
    from finance events rather than from the storefront. Because invoices frequently consolidate or
    split orders, do not assume a one-to-one mapping between an order and an invoice - reconcile on
    purchaseOrderNumber and the invoice's own order references. Budget for the finance call being slow
    and cache the balance with an explicit read time.

tasks_hint:
  - "Define the invoice projection the storefront reads and the finance integration that populates it"
  - "Reconcile invoices to orders on purchase order number and order reference"
  - "Implement pay-now as a payment with transaction state driven by the provider's confirmation"
  - "Mirror settlement back onto the order's payment state from finance events"
  - "Degrade the page to a timestamped last-known balance when finance is unreachable"

open_questions:
  - "Which system is the invoice master, and can it be queried inside the page's latency budget, or does the storefront need a synchronised projection?"
  - "Does pay-now settle one invoice, a selection, or a statement balance - and who reconciles a partial payment or an unallocated receipt?"
  - "Is the credit line and its remaining headroom exposed to the buyer, and does exceeding it block new orders, new invoices, or neither?"
  - "Does an invoice ever cover several orders or part of one, and if so what does the buyer see against each order?"

