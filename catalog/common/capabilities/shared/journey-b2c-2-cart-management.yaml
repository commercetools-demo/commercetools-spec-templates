schema_version: 1
id: base.journey-b2c-2-cart-management
version: 1.0.0
title: B2C-2 — Cart management
kind: journey
status: published
visibility: public
industry: ["*"]
business_models: ["*"]
priority: P1
epic: journeys
domains: [cart, pricing]
journeys: [B2C-2]
skill: commercetools-storefront
requirement: >
  The storefront SHALL let a buyer change the contents of their cart and see every total recalculated
  by the commerce engine before they commit to buying.
rationale: >
  The cart is the last place a buyer can still change their mind cheaply. A total the storefront
  computed itself will eventually disagree with the total charged, and that disagreement is the
  single most damaging trust failure in commerce.
scenarios:
  - id: quantity-changed
    given: a cart with at least one line
    when: the buyer changes a line quantity or removes a line
    then: the line total and the order summary are re-read from the cart, not recomputed client-side
  - id: discount-code-rejected
    given: a buyer applying a discount code
    when: the code is invalid, expired or its predicate is not met
    then: the buyer is told the code was not applied and the totals are unchanged
  - id: empty-cart
    given: a cart with no lines
    when: the buyer opens it
    then: the empty state is shown with a path back into the catalog
success_criteria:
  - { id: totals-agree, metric: the total shown in the cart equals the total charged for the same contents }
commercetools:
  entities: [Cart, LineItem, DiscountCode, CartDiscount, Type]
  api_surface:
    - kind: constraint
      ref: "Every cart update returns a new cart version; the storefront must use the returned cart rather than patching its own copy, or it will show stale totals and hit version conflicts"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/api/projects/carts
      verified_at: 2026-08-21
    - kind: constraint
      ref: "There is no update action to set the Store on an existing Cart — it must be set at creation, via in-store cart creation or CartDraft.store"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/api/projects/carts
      verified_at: 2026-08-21
  modeling_notes: >
    Treat the cart as server-owned state that the storefront renders, never as client state the
    storefront syncs. Because the Store cannot be set after creation, the buyer's commercial context
    has to be known before the first line is added.
tasks_hint:
  - "Create the cart with store and currency context before the first add-to-cart"
  - "Re-render totals from the returned cart after every mutation"
open_questions: []
