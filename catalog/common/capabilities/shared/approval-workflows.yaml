schema_version: 1
id: base.approval-workflows
version: 1.0.0
title: Order approval rules and the approver queue
status: published
visibility: public
kind: page
industry: ["*"]
business_models: [B2B, B2B2B]
sides: [seller-portal, business-storefront]
priority: P2
epic: account-self-service
page_group: "2. Account & Self-Service Pages"
journeys: [B2B-2, B2B-6]
domains: [order-management, customers, checkout]
skill: commercetools-commerce-patterns
supporting_skills: [commercetools-storefront, commercetools-connect]

requirement: >
  The system SHALL accept an approve or reject decision on an order awaiting approval only from a
  buyer holding one of the approver roles that order's approval flow currently requires.

rationale: >
  Approval authority belongs to roles, not to people, and which roles can act changes as each tier
  of the flow closes. A queue that lists every pending order to everyone either exposes the whole
  company's spend or produces actions that fail after the approver has committed to them. Stating
  the requirement at the decision rather than at the queue makes it testable: an ineligible buyer's
  action has to fail even when the queue wrongly offered it, which is the only version of this
  control that survives a frontend bug.

components:
  - { name: Rule list,                      data_source: MIDDLEWARE,
      notes: Account's approval rule records }
  - { name: Create and edit rule form,      data_source: MIDDLEWARE,
      notes: Write to approval service }
  - { name: Approver assignment options,    data_source: MIDDLEWARE,
      notes: Account user list }
  - { name: Pending approvals queue,        data_source: MIDDLEWARE,
      notes: Real-time queue from order service }
  - { name: Approve and reject actions,     data_source: MIDDLEWARE,
      notes: Write to order and notification service }
  - { name: Approval history log,           data_source: MIDDLEWARE,
      notes: Audit log query }

scenarios:
  - id: eligible-approver-acts
    given: an order whose approval flow names the buyer's role in its currently open tier
    when: that buyer approves
    then: the approval is recorded against them with a timestamp and the flow either opens the next tier or completes
  - id: ineligible-approver-refused
    given: a buyer whose roles appear nowhere in the flow's eligible approvers
    when: they submit an approval
    then: the platform refuses the action, whatever the queue displayed to them
  - id: two-approvers-act-at-once
    given: two approvers who opened the same pending approval at the same version
    when: the second one submits after the first has landed
    then: their action is refused as based on a stale version and they are shown the decision that landed first, not a generic error
  - id: single-rejection-is-final
    given: an approval flow where the first tier has already approved
    when: any eligible approver rejects
    then: the whole flow is rejected with the reason recorded, and no later approval revives it
  - id: rule-paused-not-deleted
    given: a policy the company wants to suspend for a quarter
    when: the administrator sets the rule inactive
    then: new orders stop matching it while the rule and its history remain readable

success_criteria:
  - { id: eligibility-enforced-server-side, metric: no approval or rejection is ever recorded from a buyer outside the flow's eligible approvers }
  - { id: no-lost-decisions, metric: "a concurrent decision is reported to the losing approver with the winning outcome, never silently discarded" }

commercetools:
  entities: [ApprovalRule, ApprovalFlow, AssociateRole, BusinessUnit, Order, Subscription, Message]
  api_surface:
    - kind: constraint
      ref: "Both requesters and approvers on an ApprovalRule are AssociateRole references - RuleRequester and RuleApprover each require an associateRole and carry no customer field - so approval authority cannot be bound to a named individual and survives staff changes by design"
      grounded_by: oas-schemata
      doc: https://docs.commercetools.com/api/projects/approval-rules
      verified_at: 2026-08-21
    - kind: concept
      ref: "An ApprovalRule's approvers field is an ApproverHierarchy of tiers; each tier is an ApproverConjunction of ApproverDisjunctions over approver roles, giving AND of OR semantics. Tiers are sequential, a rule supports up to five of them, and a higher tier approving early automatically approves all lower tiers"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/api/associates-overview
      verified_at: 2026-08-21
    - kind: constraint
      ref: "Approval governance evaluates Orders, not Carts: the rule's predicate is an Order Predicate and the platform creates the ApprovalFlow at the moment an Order is placed and matches an active rule - so a requester discovers the approval requirement after submitting, not while still in the cart"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/configure-approval-workflows/why-procurement-governance-matters
      verified_at: 2026-08-21
    - kind: constraint
      ref: "A threshold predicate has to constrain currency - either the money form totalPrice > \"50000.00 AUD\" or totalPrice.centAmount paired with totalPrice.currencyCode. A bare centAmount comparison matches the same integer in every currency, so it either demands approval where it should not or lets a large order through"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/configure-approval-workflows/approval-rules-predicates-and-requesters
      verified_at: 2026-08-21
    - kind: update-action
      ref: "approve and reject are the ApprovalFlow update actions, reject taking an optional reason. ApprovalFlowStatus is Pending, Approved or Rejected; Approved is set automatically once every required role across all tiers has approved, and a single rejection sets the whole flow Rejected"
      grounded_by: oas-schemata
      doc: https://docs.commercetools.com/api/projects/approval-flows
      verified_at: 2026-08-21
    - kind: constraint
      ref: "Approve and reject are read-then-write on the flow's version; if another approver acted first the update fails with 409 ConcurrentModification, which is handled by re-reading the flow and reassessing rather than by retrying"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/configure-approval-workflows/approval-flows-in-action
      verified_at: 2026-08-21
    - kind: constraint
      ref: "The platform sends no approval notifications. Subscribe to ApprovalFlow Messages such as ApprovalFlowCreated, then resolve currentTierPendingApprovers to the Associates holding those roles and notify them through your own channel; the frontend gates on eligibleApprovers but the platform is what enforces eligibility"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/configure-approval-workflows/approval-flows-in-action
      verified_at: 2026-08-21
    - kind: concept
      ref: "The approval history sits on the flow itself: approvals carries an approver and approvedAt per approval, and rejection carries rejecter, rejectedAt and an optional reason, alongside eligibleApprovers, pendingApprovers and currentTierPendingApprovers"
      grounded_by: oas-schemata
      doc: https://docs.commercetools.com/api/projects/approval-flows
      verified_at: 2026-08-21
    - kind: constraint
      ref: "Writing Approval Rules needs the manage_approval_rules scope and reading them view_approval_rules, while acting on a flow needs manage_approval_flows; only a high-authority role should hold manage_approval_rules, since it is the power to rewrite the company's own spending controls"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/configure-approval-workflows/approval-rules-predicates-and-requesters
      verified_at: 2026-08-21
  modeling_notes: >
    Keep requester and approver role sets disjoint for any spend that needs a second pair of eyes -
    the platform does not enforce separation of duties, the rule's shape only implies it. Only Active
    rules are evaluated, so deactivate rather than delete when a policy is being paused. A
    category-based or cost-centre-based rule has no native field to test, so tag the Cart or Order
    with a Custom Field and reference it as custom.<fieldName> in the predicate, keeping the field
    definition and the predicate in step: a predicate naming a field the Order does not carry never
    matches, and never matching looks exactly like no policy at all.

tasks_hint:
  - "Build the pending queue from approval flows in Pending status and gate the action buttons on the approver's roles against currentTierPendingApprovers"
  - "Implement approve and reject with the flow's current version and a 409 re-read path"
  - "Wire approver notification from an ApprovalFlow message subscription, resolving roles to associates"
  - "Implement rule create and edit with a currency-constrained threshold predicate and role-based requesters and approvers"

open_questions:
  - "The source's approver picker is an account user list, but commercetools binds approvers to Associate Roles and offers no way to name an individual. Confirm the buyer accepts role-level approver assignment, or scope a role-per-named-approver shim and price the role sprawl it causes."
  - "Approval is evaluated on the Order, so a requester only learns their order needs approval after placing it. Does the buyer need a pre-submission warning, and if so what recomputes the predicate against the cart, given the predicate language targets Orders?"
  - "Which permission lets a buyer administrator create and edit rules from the portal at all? manage_approval_rules is an OAuth scope rather than an Associate Permission, so the gate has to be built in the middleware - decide what it checks."
  - "Should the history log show only the flow's own approvals and rejection, or a fuller audit assembled from messages? The flow records the outcome but not the intermediate views of who was pending when."

