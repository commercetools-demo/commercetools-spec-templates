schema_version: 1
id: base.password-reset
version: 1.0.0
title: Password reset gated on a valid, unexpired reset token
status: published
visibility: public
kind: page
industry: ["*"]
business_models: ["*"]
priority: P1
epic: utility-system
page_group: "5. Utility & System Pages"
journeys: [B2C-3, B2B-1]
domains: [customers]
skill: commercetools-storefront
supporting_skills: [commercetools-platform, commercetools-connect]

requirement: >
  The system SHALL change an account's password only when the submission carries a reset token that
  is unexpired and was issued for that account, refusing unknown, expired and already-consumed
  tokens with a path to request a new one.

rationale: >
  Account recovery is the one unauthenticated flow that hands over control of an account, so the
  token is the whole of the authorization. Two things follow: the token has to be validated on the
  server before the new password is accepted, and the page must never let its own responses reveal
  which email addresses have accounts, since that turns recovery into an account-enumeration tool.

components:
  - { name: Email input and submit,                 data_source: MIDDLEWARE, notes: Triggers the reset email via the identity service }
  - { name: Token validation,                       data_source: MIDDLEWARE, notes: Validates the reset token carried by the email link }
  - { name: New password form and submission,       data_source: MIDDLEWARE, notes: Writes to the identity service }
  - { name: Password strength indicator,            data_source: STATIC,     notes: Client-side validation }

scenarios:
  - id: token-valid-password-changed
    given: a reset link opened while its token is still within its validity window
    when: a new password that satisfies the password policy is submitted
    then: the password is changed and the buyer is required to sign in again, because sessions issued before the reset no longer authenticate
  - id: token-expired-or-consumed
    given: a reset link whose token has expired or has already been used
    when: the page loads
    then: the page states that the link is no longer usable and lets a new reset be requested from that same page, without sending the buyer back to sign-in to start over
  - id: address-with-no-account
    given: an email address that matches no account
    when: a reset is requested for it
    then: the confirmation shown is indistinguishable from the one shown for a known address, and no message, timing hint or error discloses that the account does not exist
  - id: password-fails-policy
    given: a new password that does not satisfy the password policy
    when: it is submitted
    then: it is refused before any call to the identity service, naming the rule it failed

success_criteria:
  - { id: no-enumeration, metric: responses to a request for a known and an unknown address are indistinguishable to the caller }
  - { id: no-stale-session, metric: no session issued before a reset can still act on the account afterwards }

commercetools:
  entities: [Customer, CustomerToken, Store]
  api_surface:
    - kind: rest
      ref: "POST /{projectKey}/customers/password-token takes the customer's email plus optional ttlMinutes and invalidateOlderTokens, and returns a CustomerToken carrying value (the reset token) and expiresAt"
      grounded_by: oas-schemata
      doc: https://docs.commercetools.com/api/projects/customers
      verified_at: 2026-08-21
    - kind: rest
      ref: "POST /{projectKey}/customers/password/reset takes tokenValue and newPassword; on success the access and refresh tokens previously issued through the password flow and refresh token flow are invalidated, with eventual consistency"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-implement-carts-and-shopping-lists/manage-signups-and-signins/password-reset-flow
      verified_at: 2026-08-21
    - kind: constraint
      ref: "commercetools returns the reset token to the caller and does not deliver it - sending the link to the customer's registered address is the application's job, so an email service provider is part of this flow and not an optional extra"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-implement-carts-and-shopping-lists/manage-signups-and-signins/password-reset-flow
      verified_at: 2026-08-21
    - kind: constraint
      ref: "The password reset flow deliberately does not reveal whether the submitted email address exists, so the storefront must not add a not-found response of its own on top of it"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-implement-carts-and-shopping-lists/manage-signups-and-signins/password-reset-flow
      verified_at: 2026-08-21
    - kind: constraint
      ref: "Creating a password reset token produces a CustomerPasswordTokenCreated Message that carries the token's value only when the token's validity is 60 minutes or less; a longer-lived token is omitted from the message, so a subscription-driven email cannot deliver it"
      grounded_by: oas-schemata
      doc: https://docs.commercetools.com/api/projects/customers
      verified_at: 2026-08-21
    - kind: constraint
      ref: "A Store-specific customer must use the in-store variant /{projectKey}/in-store/key={storeKey}/customers/password-token; if the customer exists in the Project but its stores field references a different Store, that endpoint returns a ResourceNotFound error"
      grounded_by: oas-schemata
      doc: https://docs.commercetools.com/api/projects/customers
      verified_at: 2026-08-21
  modeling_notes: >
    Two delivery designs exist and the choice is architectural: call the token endpoint from the
    middleware and hand the token to the email provider synchronously, or subscribe to the token-
    created message and let a connector send it. The second only works while the token's validity is
    at most 60 minutes, because longer-lived tokens are stripped from the message. Either way the
    token never reaches the browser except inside the emailed link, and the reset submission is
    server-side. Where an external identity provider owns credentials, none of this applies: the
    commercetools Customer is then a profile record and the token flow belongs to that provider.

tasks_hint:
  - "Request a reset token server-side and hand it to the email provider without logging its value"
  - "Validate the token on page load so an expired link is reported before the buyer types a password"
  - "Return an identical response for known and unknown email addresses"
  - "Force re-authentication after a successful reset and clear the local session"

open_questions:
  - "Does commercetools own credentials for this storefront, or does an external identity provider, in which case the token endpoints, TTL and password policy all move there?"
  - "What token validity applies, and does requesting a second reset invalidate the first link - that is, is invalidateOlderTokens set on the request?"
  - "Where is the password policy enforced so the client-side strength indicator and the server agree on a single set of rules?"
  - "Do buyers in Stores need the in-store token endpoints, and if so how does the page resolve the Store before the buyer is authenticated?"

