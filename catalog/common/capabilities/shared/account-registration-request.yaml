schema_version: 1
id: base.account-registration-request
version: 1.0.0
title: Account request held until the seller activates it
status: published
visibility: public
kind: page
industry: ["*"]
business_models: ["*"]
priority: P1
epic: account-self-service
page_group: "2. Account & Self-Service Pages"
journeys: [B2C-3, B2B-1]
domains: [customers]
skill: commercetools-storefront
supporting_skills: [commercetools-commerce-patterns]

requirement: >
  The system SHALL record a submitted account request and withhold any ordering capability from it
  until the seller's activation step has completed.

rationale: >
  A self-registered buyer has not yet been vetted: for a business account the seller still has to
  check tax and credit details and decide which assortment and prices apply, and for a consumer
  account the address still has to be proven. Activating on submission would let an unvetted buyer
  transact at default prices, so the request and the active account are two different states and the
  page has to make the difference visible.

components:
  - { name: "Company and contact fields",       data_source: STATIC,
      notes: "UI form shell" }
  - { name: "Industry or segment dropdown",     data_source: CACHED, business_models: [B2B],
      notes: "Config- or CMS-managed options" }
  - { name: "Form submission",                  data_source: MIDDLEWARE,
      notes: "Creates a pending account record" }
  - { name: "Confirmation and status state",    data_source: MIDDLEWARE,
      notes: "Response from the registration service" }

scenarios:
  - id: request-recorded-not-active
    given: a visitor who has completed the form
    when: the request is submitted
    then: the account and, for a business buyer, its organisation are recorded, the buyer is told activation is pending, and no path to ordering is offered
  - id: address-already-registered
    given: an email address that already belongs to an account
    when: the request is submitted
    then: the submission is refused without confirming that the address is registered, and sign-in and password-reset paths are offered instead
  - id: verification-link-expired
    given: a verification link whose token has passed its lifetime
    when: the buyer opens it
    then: the failure is stated plainly and a fresh verification message can be requested from the same page
  - id: activation-completes
    given: a recorded request that the seller has now activated
    when: the buyer next signs in
    business_models: [B2B]
    then: their assortment and negotiated prices resolve and ordering becomes available without a second registration

success_criteria:
  - { id: no-unvetted-orders, metric: no order is ever placed by an account whose activation step has not completed }

commercetools:
  entities: [Customer, BusinessUnit, CustomerToken, AssociateRole, Store, Type]
  api_surface:
    - kind: rest
      ref: "POST /{projectKey}/customers creates the Customer with isEmailVerified false; POST /customers/email-token then POST /customers/email/confirm completes verification, and sending the message is the implementation's job, not the platform's"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/api/customers-overview
      verified_at: 2026-08-21
    - kind: constraint
      ref: "A Business Unit created through the My Business Units API is Inactive by default and its status cannot be changed through that API, so the merchant inspects it, assigns Products and Prices and activates it from a trusted context; the default is a Project-level setting"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/api/projects/me-business-units
      verified_at: 2026-08-21
    - kind: constraint
      ref: "The My Business Units API also refuses to manage a unit's Stores or to assign Associates, so seating the first colleague of a newly registered company runs server-side with addAssociate on the Business Unit"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/api/projects/me-business-units
      verified_at: 2026-08-21
    - kind: concept
      ref: "Provisioning order is fixed: create the Associate Roles, then the Customer, then add the Customer as an Associate with role assignments - roles must exist before they can be assigned"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/configure-associate-access/customers-and-associates
      verified_at: 2026-08-21
    - kind: constraint
      ref: "The Change Email update action resets isEmailVerified to false even when the address submitted is identical to the current one, so a profile edit can silently de-verify an active account"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/api/customers-overview
      verified_at: 2026-08-21
  modeling_notes: >
    Model the pending organisation as the Business Unit itself in its inactive state plus a custom
    field carrying the review status; do not invent a parallel pending-account resource that then has
    to be reconciled. For a consumer account the same page collapses to Customer creation plus email
    verification, with no organisation and no seller review.

tasks_hint:
  - "Implement account request submission that creates an inactive organisation and a customer record"
  - "Implement the pending, verified and activated states of the request as distinct buyer-visible states"

open_questions:
  - "Which attributes does credit and tax review actually need at submission (tax id, credit references, trade references), and are they held on the organisation or in the seller's CRM?"
  - "Does a buyer with a recorded but unactivated request see a default assortment, a price-free catalog, or nothing at all?"

