schema_version: 1
id: base.email-verification
version: 1.0.0
title: Email verification by token with a recoverable resend path
status: published
visibility: public
kind: page
industry: ["*"]
business_models: ["*"]
priority: P2
epic: utility-system
page_group: "5. Utility & System Pages"
journeys: [B2C-3, B2B-1]
domains: [customers]
skill: commercetools-storefront
supporting_skills: [commercetools-platform, commercetools-connect]

requirement: >
  The system SHALL record an email address as verified only when the request carries a verification
  token that is unexpired and was issued for that account, and otherwise report the outcome as a
  recoverable state offering a fresh verification email.

rationale: >
  Verification proves the buyer controls the address the account is keyed on, which is what makes
  later recovery and notification trustworthy. The page is reached by clicking a link that may be
  hours or days old, so the expired case is the common case rather than the exception, and a dead
  end there abandons an account that has already been created.

components:
  - { name: Token validation and status,     data_source: MIDDLEWARE, notes: Identity service token check }
  - { name: Resend verification email,       data_source: MIDDLEWARE, notes: Triggers a new email from the identity service }
  - { name: Redirect on success,             data_source: STATIC,     notes: Config-driven redirect target }

scenarios:
  - id: token-valid-address-confirmed
    given: a verification link opened while its token is still valid
    when: the page loads
    then: the address is recorded as verified on the account and the buyer is sent to the configured destination without a further click
  - id: token-expired
    given: a verification link whose token has expired
    when: the page loads
    then: the page states that the link expired, offers to send a new one, and does not retry the dead token silently
  - id: resend-needs-an-identified-account
    given: a visitor who opens an expired link with no active session
    when: they ask for a new verification email
    then: they are asked to sign in first, because a new token can only be requested for an account the storefront can identify
  - id: link-opened-twice
    given: an account whose address is already verified
    when: the same verification link is opened again
    then: the buyer is told the address is already confirmed and routed to the configured destination, rather than shown a token error

success_criteria:
  - { id: no-dead-end, metric: every failed verification offers a route to a new email or to sign-in, with no terminal error state }

commercetools:
  entities: [Customer, CustomerToken, Store]
  api_surface:
    - kind: rest
      ref: "POST /{projectKey}/customers/email/confirm takes tokenValue and, when the token is valid and unexpired, sets isEmailVerified to true on the Customer; an invalid or expired token returns an error"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-implement-carts-and-shopping-lists/manage-signups-and-signins/customer-signup-and-email-verification
      verified_at: 2026-08-21
    - kind: constraint
      ref: "POST /{projectKey}/customers/email-token requires the Customer id and ttlMinutes - unlike the password reset token endpoint it does not accept an email address, so a resend needs the account already identified from a session or a server-side lookup"
      grounded_by: oas-schemata
      doc: https://docs.commercetools.com/api/projects/customers
      verified_at: 2026-08-21
    - kind: constraint
      ref: "Email templates and delivery belong to an external email service provider, not to commercetools; commercetools only issues the token"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-implement-carts-and-shopping-lists/manage-signups-and-signins/customer-signup-and-email-verification
      verified_at: 2026-08-21
    - kind: constraint
      ref: "The CustomerEmailTokenCreated message includes tokenValue only when ttlMinutes is 60 or fewer; for longer validity the value is omitted, so a subscription-driven resend must keep the token short-lived"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-implement-carts-and-shopping-lists/manage-signups-and-signins/customer-signup-and-email-verification
      verified_at: 2026-08-21
    - kind: constraint
      ref: "For a Store-specific customer use /{projectKey}/in-store/key={storeKey}/customers/email-token; if the customer exists in the Project but its stores field references a different Store, the in-store endpoint returns a ResourceNotFound error"
      grounded_by: oas-schemata
      doc: https://docs.commercetools.com/api/projects/customers
      verified_at: 2026-08-21
  modeling_notes: >
    Keep the verified flag as the single source of truth for whether the address is proven, and
    decide separately what an unverified account is allowed to do - the platform does not gate
    anything on it by itself. The resend path is the part that gets designed wrong: because the
    token endpoint is keyed on the Customer id, a resend from a cold link needs the account resolved
    server-side, so plan for either an authenticated resend or a middleware lookup rather than a
    form that takes an email address. Keep validity at or below 60 minutes if a connector is to
    deliver the email from the token-created message.

tasks_hint:
  - "Validate the token server-side on page load and branch on valid, expired and already-verified"
  - "Implement resend for an identified account and state what happens when the account cannot be identified"
  - "Decide and enforce what an account with an unverified address may do"

open_questions:
  - "Is a verification token invalidated once used, so a second click on the same link fails, or can the link be replayed until it expires?"
  - "For an email-change flow, is the new address written to the account before or after verification, and which address signs the buyer in during the gap?"
  - "What is a company buyer allowed to do before their address is verified - browse only, or order, given company activation is a separate gate?"
  - "Which system issues the token when an external identity provider owns credentials, and does the commercetools verified flag then need syncing at all?"

