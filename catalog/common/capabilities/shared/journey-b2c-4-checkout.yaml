schema_version: 1
id: base.journey-b2c-4-checkout
version: 1.0.0
title: B2C-4 — Checkout
kind: journey
status: published
visibility: public
industry: ["*"]
business_models: ["*"]
priority: P1
epic: journeys
domains: [checkout, fulfillment, cart]
journeys: [B2C-4]
skill: commercetools-checkout
supporting_skills: [commercetools-storefront, commercetools-commerce-patterns]
requirement: >
  The storefront SHALL convert a cart into a placed order only after the buyer has seen the final
  amount, including shipping and tax, that will be charged for it.
rationale: >
  Checkout is the one irreversible step. Shipping cost and tax are not known until an address and a
  delivery method exist, so the total moves during the flow; a buyer who is charged an amount they
  were never shown disputes the order, and a payment authorized for a stale amount fails on capture.
scenarios:
  - id: address-changes-the-total
    given: a cart in checkout
    when: the buyer sets or changes the shipping address or the delivery method
    then: shipping cost, tax and the available delivery options are re-read from the cart before the summary is shown again
  - id: totals-moved-after-authorization
    given: an authorized payment for a given amount
    when: the cart total changes before the order is created
    then: the order is not placed against the stale authorization, and the buyer is asked to re-authorize the new amount
  - id: placement-fails-at-the-last-moment
    given: a submitted checkout
    when: order creation fails on a late validation such as a tax or discount change
    then: the buyer is given a recoverable path rather than an opaque error, and no duplicate order is created on retry
  - id: approval-required-before-placement
    business_models: [B2B, B2B2B]
    given: a cart that matches an approval rule for the buyer's company
    when: the buyer submits it
    then: the order is recorded as awaiting approval and the buyer is told so on the confirmation, not by silence
success_criteria:
  - { id: no-surprise-charges, metric: no buyer is charged an amount they were not shown before submitting }
  - { id: no-duplicate-orders, metric: a retried submission never produces two orders }
commercetools:
  entities: [Cart, Order, ShippingMethod, Payment, TaxCategory, Zone]
  api_surface:
    - kind: constraint
      ref: "Setting the shipping address or the shipping method triggers automatic recalculation of shipping cost, taxes and available options — the storefront must re-read the cart after each, or it shows a mismatched summary"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-implement-checkout/custom-checkout/shipping
      verified_at: 2026-08-21
    - kind: rest
      ref: "GET shipping-methods matching-cart returns only the methods valid for the current cart given its address, contents and the project's Zones; setShippingMethod is rejected for a method that does not match the cart's conditions"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/api/projects/shippingMethods
      verified_at: 2026-08-21
    - kind: constraint
      ref: "Creating the Order snapshots all prices, discounts, taxes, shipping and payment onto the Order and moves the Cart to cartState Ordered, after which the Cart can no longer be modified"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-implement-checkout/custom-checkout/order-creation
      verified_at: 2026-08-21
    - kind: concept
      ref: "When the cart total moves away from an authorized payment amount, the documented pattern is cancel-and-re-authorize: add a CancelAuthorization transaction, then create a new Payment with the new amountPlanned"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-implement-checkout/custom-checkout/order-creation
      verified_at: 2026-08-21
    - kind: constraint
      ref: "Order creation must be idempotent against retries; a late validation failure such as a changed tax rate or an invalidated discount is a normal outcome and needs a recovery path"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-implement-checkout/custom-checkout/order-creation
      verified_at: 2026-08-21
  modeling_notes: >
    Re-read the cart after every step that can move a total, and render the summary only from what
    the cart returned. Decide the cancel-and-re-authorize policy up front: it costs conversion but
    guarantees the authorization matches the charge, and the alternative is disputes.
tasks_hint:
  - "Fetch delivery options with matching-cart rather than filtering the full shipping-method list"
  - "Re-read and re-render the cart after every address and delivery-method change"
  - "Implement idempotent order creation with a recoverable failure path"
  - "Implement cancel-and-re-authorize when the total moves after authorization"
open_questions:
  - "On a total change after authorization: re-authorize, or hold the original amount and reconcile downstream?"
provenance:
  # In-house material: commercetools authored the page inventory this was extracted
  # from, and that document is not retained. `locator` names the section it came from.
  source: authored
  locator: "User Journey Reference › B2C Journeys › B2C-4"
  contributors: ["@behnamt"]
  reviewed_by: []
  reviewed_at: 2026-08-21
