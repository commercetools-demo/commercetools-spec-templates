schema_version: 1
id: base.payment-methods
version: 1.0.0
title: Saved payment methods and account payment terms
status: published
visibility: public
kind: page
industry: ["*"]
business_models: ["*"]
priority: P2
epic: account-self-service
page_group: "2. Account & Self-Service Pages"
journeys: [B2C-6, B2B-7]
domains: [customers, checkout]
skill: commercetools-checkout
supporting_skills: [commercetools-storefront, commercetools-connect]

requirement: >
  The system SHALL hold each saved payment method as a token issued by the payment provider and
  present it to the buyer only by its non-sensitive descriptor and its default flag.

rationale: >
  A saved card is the most sensitive thing an account page touches, and the only version of it that
  is safe to keep is a token the provider can redeem and the storefront cannot. Anchoring the
  requirement on the representation, rather than on the add and remove buttons, is what keeps the
  page out of card-data scope. In a business account this page reads two systems of record at once:
  the vault for instruments, and the finance system for terms and credit, which have very different
  availability characteristics.

components:
  - { name: Saved payment method cards,        data_source: MIDDLEWARE,
      notes: Payment service or vault }
  - { name: Net terms and credit line summary, data_source: MIDDLEWARE, business_models: [B2B],
      notes: Finance or ERP integration }
  - { name: Add new card form,                 data_source: MIDDLEWARE,
      notes: Payment tokenization via middleware }
  - { name: Remove and set default,            data_source: MIDDLEWARE,
      notes: Write to payment service }

scenarios:
  - id: card-tokenized-then-listed
    given: card details submitted to the provider's tokenization form
    when: tokenization succeeds
    then: the account lists the card by brand and last four digits, and the only card reference the storefront holds is the provider's token
  - id: default-method-removed
    given: the payment method currently marked default
    when: the buyer removes it
    then: no method is marked default and the next checkout asks the buyer to choose, rather than promoting another method silently
  - id: terms-source-unavailable
    business_models: [B2B]
    given: the finance system does not answer within the page's latency budget
    when: the page renders
    then: the credit line and net terms are shown as unavailable with the time they were last known, not as a zero balance
  - id: no-methods-saved
    given: an account with no saved payment methods
    when: the buyer opens the page
    then: the absence is stated plainly with a path to add one, rather than an empty table

success_criteria:
  - { id: no-card-data-held, metric: "no card number, expiry or security code is stored by or returned from the storefront tier" }
  - { id: terms-never-guessed, metric: an unavailable credit line is reported as unavailable and never rendered as a number }

commercetools:
  entities: [PaymentMethod, Payment, Customer, BusinessUnit, CustomObject]
  api_surface:
    - kind: concept
      ref: "A PaymentMethod holds the provider token in token.value, identifies the connector through paymentInterface and optionally interfaceAccount, is owned by either a customer or a businessUnit reference, and carries a required default boolean plus a paymentMethodStatus of Active or Inactive"
      grounded_by: oas-schemata
      doc: https://docs.commercetools.com/api/projects/payment-methods
      verified_at: 2026-08-21
    - kind: update-action
      ref: "setDefault and setPaymentMethodStatus are PaymentMethod update actions; deleting a PaymentMethod takes the current version as a required query parameter and generates the PaymentMethodDeleted Message"
      grounded_by: oas-schemata
      doc: https://docs.commercetools.com/api/projects/payment-methods
      verified_at: 2026-08-21
    - kind: constraint
      ref: "Stored Payment Methods in Checkout support card payments only, and automated reversals cannot be performed against a payment made with a Stored Payment Method - a refund path that relies on automated reversal will not work for these payments"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/checkout/stored-payment-methods
      verified_at: 2026-08-21
    - kind: constraint
      ref: "The Customer has to exist in the Project before Stored Payment Methods can be used, and the customer on the PaymentMethod comes from the Cart's customerId - setting the right customerId before Checkout is initialized is the integration's responsibility, not the platform's"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/checkout/stored-payment-methods
      verified_at: 2026-08-21
    - kind: constraint
      ref: "Each Payment Connector that supports Stored Payment Methods is responsible for keeping the PaymentMethods correct and current, and paymentInterface and interfaceAccount come from the connector's deployment configuration - the storefront reads them and does not choose them"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/checkout/stored-payment-methods
      verified_at: 2026-08-21
    - kind: constraint
      ref: "commercetools has no net-terms or credit-line resource. Budget management and credit-limit enforcement are named as genuinely crossing an integration boundary to an external system, alongside invoice-based payment and reconciliation through a PSP or ERP"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/model-buyer-organizations/b2b-commerce-what-changes
      verified_at: 2026-08-21
    - kind: constraint
      ref: "A buyer's credit limit is data that belongs to no single resource instance, so it is modeled as a Custom Object rather than a Custom Field; most B2B orders settle by invoice on agreed net terms, recorded with the Payments resource while the downstream financial system issues and reconciles the invoice"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/implement-b2b-purchase-flows/the-b2b-cart
      verified_at: 2026-08-21
  modeling_notes: >
    The default flag lives on each PaymentMethod as a boolean, not as a single pointer on the
    account, so promoting one method is a change to at least two records. Prefer moving a method to
    paymentMethodStatus Inactive over deleting it where past Payments reference the same instrument,
    so history stays readable. Keep the terms panel and the vault panel independently degradable: they
    have different owners, different SLAs and different failure modes, and coupling them makes an
    unrelated ERP outage look like the buyer has no cards.

tasks_hint:
  - "List, add, remove and set-default saved payment methods through the Payment Methods API and the PSP connector"
  - "Render the account terms panel from the finance integration with an explicit unavailable state and a last-known timestamp"

open_questions:
  - "Does PaymentMethodSetDefaultAction clear the flag on the account's previously default method, or does the storefront clear it explicitly? The action takes a boolean per method, which suggests the latter - confirm before shipping, because getting it wrong leaves the buyer with two defaults or none."
  - "Which system owns the credit line, and can it be read inside the account page's latency budget, or does it have to be cached with a visible staleness marker?"
  - "Are net terms held per company or per sub-account? A Business Unit division can carry its own Custom Fields, but the finance system may only model the parent, in which case a division cannot show its own terms."
  - "Who may remove a payment method that the whole company uses - the person who added it, any administrator, or nobody from the storefront at all?"

