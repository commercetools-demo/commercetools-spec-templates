schema_version: 1
id: base.user-and-role-management
version: 1.0.0
title: Company user and role administration
status: published
visibility: public
kind: page
industry: ["*"]
business_models: [B2B, B2B2B]
sides: [seller-portal, business-storefront]
priority: P1
epic: account-self-service
page_group: "2. Account & Self-Service Pages"
journeys: [B2B-1, B2B-2]
domains: [customers, order-management]
skill: commercetools-storefront
supporting_skills: [commercetools-platform, commercetools-commerce-patterns]

requirement: >
  The system SHALL offer a company administrator only those roles the seller has marked as
  buyer-assignable when granting a team member access, and reject an assignment naming any other role.

rationale: >
  A portal that lists every role in the project invites an administrator to grant themselves the
  approval authority the seller defined roles specifically to withhold. The platform already refuses
  a non-assignable role at the API, so a picker that offers one produces a failed save with no
  explanation the administrator can act on. Filtering the picker to the assignable set is therefore
  both the security control and the usability fix, and it is the one behaviour on this page whose
  absence is silently exploitable.

components:
  - { name: User list,                            data_source: MIDDLEWARE,
      notes: Identity or account service }
  - { name: Role selector options,                data_source: CACHED,
      notes: Config-driven role definitions }
  - { name: "Invite, edit and deactivate user", data_source: MIDDLEWARE,
      notes: Write to identity service }
  - { name: Spending limits per user,             data_source: MIDDLEWARE,
      notes: Account rule configuration }

scenarios:
  - id: only-assignable-roles-offered
    given: a project with a buyer role marked buyer-assignable and an approver role marked not assignable
    when: the administrator opens the role selector for a team member
    then: the buyer role is offered and the approver role is absent from the list
  - id: non-assignable-role-refused
    given: a request naming a role the seller marked as not buyer-assignable
    when: the administrator submits it
    then: the assignment is refused and the administrator is told the role is not theirs to grant, rather than being shown a generic save failure
  - id: member-deactivated
    given: a member being removed from the company
    when: the removal succeeds
    then: that member can no longer act for the company, and any carts, orders, quotes and quote requests still naming them are listed for explicit handling rather than left as residual access
  - id: acting-user-lacks-permission
    given: an acting user whose roles carry no permission over the company's members
    when: they open the user management page
    then: access is refused outright, rather than the page rendering with controls that fail only on save

success_criteria:
  - { id: no-privilege-escalation, metric: no role outside the buyer-assignable set is ever assignable from the portal }
  - { id: deactivation-is-complete, metric: "a deactivated member retains no access to any company resource, including ones created before deactivation" }

commercetools:
  entities: [BusinessUnit, AssociateRole, Customer, Store]
  api_surface:
    - kind: constraint
      ref: "For the addAssociate, setAssociates and changeAssociate update actions, the as-associate Business Unit endpoints accept only AssociateRoles whose buyerAssignable property is true; buyerAssignable defaults to true, so a sensitive role has to be set to false deliberately"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/api/projects/associate-business-units
      verified_at: 2026-08-21
    - kind: constraint
      ref: "Removing an Associate from a Business Unit does not revoke their access to the Carts, Orders, Quotes and Quote Requests already associated with it - the Associate has to be removed from each of those entities as well before deactivation is actually complete"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/api/associates-overview
      verified_at: 2026-08-21
    - kind: constraint
      ref: "The My Business Units API cannot assign new Associates, change a Business Unit's status or manage its Stores. A buyer administrator adds a member through POST /{projectKey}/in-business-unit/key={businessUnitKey}/me/customers, which requires the UpdateAssociates Permission, or through the as-associate Business Unit endpoints from a trusted server tier"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/api/projects/me-business-units
      verified_at: 2026-08-21
    - kind: concept
      ref: "The Customer is the authentication identity; the Associate is that Customer's membership of one Business Unit together with its AssociateRoleAssignments. One Customer can be an Associate of several Business Units, may hold up to five role assignments in each, and their effective permissions are the sum of those roles with no precedence or override"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/api/associates-overview
      verified_at: 2026-08-21
    - kind: constraint
      ref: "commercetools ships no predefined Associate Roles - the seller creates every role from the Permission enum, through the API or the Merchant Center - so the role selector's options are project configuration rather than platform defaults, and a role has to exist before it can be assigned"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/configure-associate-access/associate-roles-and-permissions
      verified_at: 2026-08-21
    - kind: constraint
      ref: "Associates inherited from a parent Business Unit appear in inheritedAssociates and are eventually consistent, and inheritance needs both associateMode ExplicitAndFromParent on the child and inheritance Enabled on the parent's role assignment - so a member added at the company may be absent from a division's list for a while, and absent permanently if either setting is missing"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/configure-associate-access/inheritance-modes
      verified_at: 2026-08-21
    - kind: constraint
      ref: "There is no per-user spending-limit field. Spending authority is expressed as an Approval Rule whose predicate tests the Order and whose requesters name Associate Roles, so a limit is a property of a role and a rule rather than of a person, and budget enforcement proper sits across an integration boundary"
      grounded_by: docs-search
      doc: https://docs.commercetools.com/learning-model-b2b-commerce/configure-approval-workflows/why-procurement-governance-matters
      verified_at: 2026-08-21
  modeling_notes: >
    Provision in order - Associate Role, then Customer, then addAssociate with role assignments -
    because the API and the Merchant Center both block the assignment step until the role exists.
    Build the user list from the Business Unit's own associates plus inheritedAssociates, and label
    inherited entries as such: an administrator who cannot tell the difference will try to edit a
    role assignment that belongs to the parent unit. Keep requesting and approving permissions in
    separate roles; the platform does not enforce separation of duties, the rule shape only implies it.

tasks_hint:
  - "Build the member list from the business unit's explicit and inherited associates, labelling each"
  - "Filter the role selector to buyer-assignable roles and surface a refused assignment as a permission message"
  - "Implement deactivation as associate removal plus explicit handling of the resources still naming that associate"

open_questions:
  - "Where do per-user spending limits actually live? A limit per person has no home in the platform; it can be approximated with one role and one approval rule per spend band, which multiplies roles quickly. Confirm the buyer accepts band granularity before designing around it."
  - "There is no pending-invite resource - a member either exists as a Customer and Associate or does not. Decide whether the middleware owns invite tokens, expiry and re-send, and what an unaccepted invite looks like in the user list."
  - "Does deactivating a member mean removeAssociate, or assigning a role with no permissions? Removal is cleaner but loses the record of who they were on resources that only reference the association."
  - "Which permission gates the page itself? UpdateAssociates governs the write, but the me endpoints do not validate View permissions, so read access has to be gated in the middleware."

