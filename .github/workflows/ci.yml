name: ci
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.19, cache: npm }
      - run: npm ci

      # Gate 1: the generated artifacts in git match what the sources produce right now.
      # `lint` exits 3 on golden drift, which is a failed PR, not a warning.
      - name: sources and generated output agree
        run: node bin/ctsx.mjs lint --strict

      - name: collector forms are current
        run: |
          node bin/ctsx.mjs collect:render
          git diff --exit-code collector/forms/

      - name: nothing generated was left uncommitted
        run: git diff --exit-code registry.json dist/ rendered/

      # Gate 2: unit + end-to-end, offline (the overlay is a separate package).
      - run: npm test

      # Gate 3: every source file carries its licence. This repo is consumed by copy-paste — a
      # rendered spec lands in someone else's project with no LICENSE near it — so the header is
      # the only part of the licensing that travels. Generated trees are excluded because the
      # renderers emit the notice into them; fixtures/openspec-init/ is excluded because it is a
      # verbatim copy of `openspec init` output and stamping our copyright on it would be a lie.
      - name: every source file has an SPDX header
        run: |
          missing=$(git ls-files '*.mjs' '*.yaml' '*.yml' \
            | grep -vE '^(rendered|dist|collector/forms)/' \
            | grep -vE '^fixtures/openspec-init/' \
            | xargs grep -L 'SPDX-License-Identifier')
          if [ -n "$missing" ]; then
            echo "::error::source files with no SPDX header:"; echo "$missing"; exit 1
          fi

      # Gate 4: the output satisfies the target framework's OWN validator, not ours. OpenSpec finds
      # its root by walking up from the process cwd — there is no flag or env var for it — so the
      # validator has to run from inside the probe, exactly as docs/runbook.md tells a human to.
      - name: validate against real OpenSpec
        run: |
          rm -rf /tmp/probe && mkdir -p /tmp/probe && cp -R fixtures/openspec-init/. /tmp/probe/
          node bin/cts.mjs apply --cwd /tmp/probe --industry grocery --model B2C --no-overlay
          (cd /tmp/probe && npx -y @fission-ai/openspec@latest validate --specs --strict)
